[project]
name = "radiko-restream-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angelmaneuver" }
]
requires-python = ">=3.14"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "streamlink>=8.5.0",
]

[project.scripts]
radiko-restream-server = "radiko_restream_server:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = ["EXE001"]

[tool.pyright]
extraPaths = [
    ".venv/lib/python3.14/site-packages",
    ".venv/lib64/python3.14/site-packages",
]
